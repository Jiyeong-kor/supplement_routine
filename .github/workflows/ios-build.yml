name: iOS Build

on:
  push:
    paths:
      - ".github/workflows/ios-build.yml"
      - "kmp/**"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-device-ipa:
    name: Unsigned iOS device app
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Build shared iOS release framework
        run: gradle -p kmp :shared:linkReleaseFrameworkIosArm64 :shared:assembleSupplementRoutineSharedReleaseXCFramework --build-cache --no-daemon

      - name: Archive iOS app without signing
        run: |
          xcodebuild \
            -project kmp/iosApp/SupplementRoutineIos.xcodeproj \
            -scheme SupplementRoutineIos \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SupplementRoutineIos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/SupplementRoutineIos.xcarchive/Products/Applications/SupplementRoutineIos.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry SupplementRoutineIos-unsigned.ipa Payload)
          tar -czf "$RUNNER_TEMP/SupplementRoutineIos.xcarchive.tar.gz" -C "$RUNNER_TEMP" SupplementRoutineIos.xcarchive

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: supplement-routine-ios-unsigned
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/SupplementRoutineIos-unsigned.ipa
            ${{ runner.temp }}/SupplementRoutineIos.xcarchive.tar.gz
